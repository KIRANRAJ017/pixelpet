appId: com.pixelpet.app
productName: Pixel Pet
copyright: Copyright © 2026 Pixel Pet Team
directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - "!dist/downloads/**/*"
  - "!dist/download-page/**/*"
  - dist-electron/**/*
  - assets/**/*
  - package.json

extraResources:
  - from: assets
    to: assets

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/app-icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Pixel Pet
  uninstallDisplayName: Pixel Pet
